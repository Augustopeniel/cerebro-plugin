[project]
name = "cerebro-cofre-broker"
version = "2.8.0"
description = "Broker local do cofre do cérebro (plugin cerebro): entrega credenciais sem mostrá-las ao Claude"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23",
    "cryptography>=50",
]

[project.scripts]
cerebro-cofre = "cofre_broker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cofre_broker"]

[tool.ruff]
# as regras do repositório, mas para o Python mínimo do broker
extend = "../../../pyproject.toml"
target-version = "py311"
cache-dir = "../../../.ruff_cache"  # nada de cache dentro do plugin
